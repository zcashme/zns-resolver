name: Release

on:
  push:
    branches: [master]
    tags: ['v[0-9]*']
    paths:
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - src/**
      - Dockerfile.stagex
      - Dockerfile.guest
      - guest/**
      - .github/workflows/release.yml
  pull_request:
    paths:
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - src/**
      - Dockerfile.stagex
      - Dockerfile.guest
      - guest/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      staging:
        description: Use Let's Encrypt staging in the guest image (untrusted test certificates)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke-test both networks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          expected = f'v{version}'
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Tag {actual!r} must match Cargo.toml version: {expected}')
          PY
      - uses: docker/setup-buildx-action@v4
      - name: Build static binaries and run offline smoke checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.stagex
          platforms: linux/amd64
          target: binaries
          outputs: type=local,dest=dist
          provenance: false
          cache-from: type=gha,scope=stagex-amd64
          cache-to: type=gha,scope=stagex-amd64,mode=max
      - name: Record build inputs and checksums
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          images = [line for line in Path('Dockerfile.stagex').read_text().splitlines()
                    if line.startswith('FROM stagex/')]
          Path('dist/BUILD-INFO.txt').write_text('\n'.join([
              f'version={version}',
              f'commit={os.environ["SOURCE_COMMIT"]}',
              f'ref={os.environ["SOURCE_REF"]}',
              'target=x86_64-unknown-linux-musl',
              *images,
              '',
          ]))
          PY
          cd dist
          sha256sum zns-resolver-*-x86_64-linux-musl BUILD-INFO.txt > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zns-resolver-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package resolver image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zns-resolver-linux-amd64
          path: binaries
      - name: Verify resolver artifacts
        working-directory: binaries
        run: |
          sha256sum --check SHA256SUMS
          chmod +x zns-resolver-*-x86_64-linux-musl
      - uses: docker/setup-buildx-action@v4
      - name: Build kernel and runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.guest
          platforms: linux/amd64
          target: userspace
          outputs: type=local,dest=userspace
          provenance: false
          cache-from: type=gha,scope=stagex-kernel-amd64
          cache-to: type=gha,scope=stagex-kernel-amd64,mode=max
      - uses: actions/cache@v4
        with:
          path: guest-cache
          key: guest-inputs-${{ hashFiles('guest/versions.toml') }}
      - name: Prepare firmware and measurement tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import tomllib
          sys.path.insert(0, 'guest')
          from build import fetch
          pins = tomllib.loads(Path('guest/versions.toml').read_text())
          cache = Path('guest-cache')
          cache.mkdir(exist_ok=True)
          wheel = fetch(pins['measure_url'], pins['measure_sha256'], cache)
          Path('/tmp/sev_snp_measure-0.0.13-py3-none-any.whl').write_bytes(wheel)
          firmware = fetch(pins['archive'] + pins['firmware_package'], pins['firmware_package_sha256'], cache)
          Path('/tmp/ovmf-amdsev.deb').write_bytes(firmware)
          PY
          dpkg-deb --fsys-tarfile /tmp/ovmf-amdsev.deb | tar -xOf - ./usr/share/ovmf/OVMF.amdsev.fd > userspace/boot/OVMF.amdsev.fd
          python3 -m venv .guest-measure
          .guest-measure/bin/pip install --disable-pip-version-check /tmp/sev_snp_measure-0.0.13-py3-none-any.whl
      - name: Assemble guest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          STAGING: ${{ github.event_name == 'workflow_dispatch' && inputs.staging }}
        run: |
          args=()
          if [[ "$STAGING" == true ]]; then args+=(--staging); fi
          python3 guest/build.py --userspace userspace --binaries binaries \
            --cache guest-cache --output guest-release \
            --measure-tool "$PWD/.guest-measure/bin/sev-snp-measure" \
            --source-commit "$SOURCE_COMMIT" "${args[@]}"
          cd guest-release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zns-resolver-guest-amd64
          path: guest-release/zns-resolver-guest-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [build, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zns-resolver-*
          path: dist
          merge-multiple: true
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum zns-resolver-guest-x86_64.tar.gz >> SHA256SUMS
          release_args=()
          version_without_metadata="${RELEASE_TAG%%+*}"
          if [[ "$version_without_metadata" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag --generate-notes \
            --title "zns-resolver $RELEASE_TAG" \
            "${release_args[@]}" \
            zns-resolver-mainnet-x86_64-linux-musl \
            zns-resolver-testnet-x86_64-linux-musl \
            zns-resolver-guest-x86_64.tar.gz \
            SHA256SUMS BUILD-INFO.txt
