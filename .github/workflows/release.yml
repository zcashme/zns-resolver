name: Release

on:
  push:
    branches: [master]
    tags: ['v[0-9]*']
    paths:
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - src/**
      - Dockerfile.stagex
      - Dockerfile.guest
      - guest/**
      - .github/workflows/release.yml
  pull_request:
    paths:
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - src/**
      - Dockerfile.stagex
      - Dockerfile.guest
      - guest/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      staging:
        description: Use Let's Encrypt staging in the guest image (untrusted test certificates)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke-test both networks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG must match Cargo.toml version: v$version" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Build static binaries and run offline smoke checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.stagex
          platforms: linux/amd64
          target: binaries
          outputs: type=local,dest=dist
          provenance: false
          cache-from: type=gha,scope=stagex-amd64
          cache-to: type=gha,scope=stagex-amd64,mode=max
      - name: Record build inputs and checksums
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          {
            echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            echo "commit=$SOURCE_COMMIT"
            echo "ref=$SOURCE_REF"
            echo "target=x86_64-unknown-linux-musl"
            grep '^FROM stagex/' Dockerfile.stagex
          } > dist/BUILD-INFO.txt
          cd dist
          sha256sum zns-resolver-*-x86_64-linux-musl BUILD-INFO.txt > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zns-resolver-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package resolver image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zns-resolver-linux-amd64
          path: binaries
      - name: Verify resolver artifacts
        working-directory: binaries
        run: |
          sha256sum --check SHA256SUMS
          chmod +x zns-resolver-*-x86_64-linux-musl
      - uses: docker/setup-buildx-action@v4
      - name: Build guest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.guest
          platforms: linux/amd64
          target: guest
          build-contexts: resolvers=binaries
          build-args: |
            ACME_DIRECTORY=${{ (github.event_name == 'workflow_dispatch' && inputs.staging) && 'https://acme-staging-v02.api.letsencrypt.org/directory' || 'https://acme-v02.api.letsencrypt.org/directory' }}
          outputs: type=local,dest=guest-release/zns-resolver-guest
          provenance: false
          cache-from: type=gha,scope=stagex-guest-amd64
          cache-to: type=gha,scope=stagex-guest-amd64,mode=max
      - name: Archive guest
        working-directory: guest-release
        run: |
          (cd zns-resolver-guest && sha256sum --check SHA256SUMS)
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --mode=a=r,u+w \
            -cf - zns-resolver-guest | gzip -n > zns-resolver-guest-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: zns-resolver-guest-amd64
          path: guest-release/zns-resolver-guest-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [build, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zns-resolver-*
          path: dist
          merge-multiple: true
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum zns-resolver-guest-x86_64.tar.gz >> SHA256SUMS
          release_args=()
          version_without_metadata="${RELEASE_TAG%%+*}"
          if [[ "$version_without_metadata" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag --generate-notes \
            --title "zns-resolver $RELEASE_TAG" \
            "${release_args[@]}" \
            zns-resolver-mainnet-x86_64-linux-musl \
            zns-resolver-testnet-x86_64-linux-musl \
            zns-resolver-guest-x86_64.tar.gz \
            SHA256SUMS BUILD-INFO.txt
