name: Release

on:
  push:
    branches: [master]
    tags: ['v[0-9]*']
    paths:
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - src/**
      - Dockerfile.stagex
      - Dockerfile.guest
      - guest/**
      - .github/workflows/release.yml
  pull_request:
    paths:
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - src/**
      - Dockerfile.stagex
      - Dockerfile.guest
      - guest/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke-test both networks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          expected = f'v{version}'
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Tag {actual!r} must match Cargo.toml version: {expected}')
          PY
      - uses: docker/setup-buildx-action@v4
      - name: Build static binaries and run offline smoke checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.stagex
          platforms: linux/amd64
          target: binaries
          outputs: type=local,dest=dist
          provenance: false
          cache-from: type=gha,scope=stagex-amd64
          cache-to: type=gha,scope=stagex-amd64,mode=max
      - name: Record build inputs and checksums
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          images = [line for line in Path('Dockerfile.stagex').read_text().splitlines()
                    if line.startswith('FROM stagex/')]
          Path('dist/BUILD-INFO.txt').write_text('\n'.join([
              f'version={version}',
              f'commit={os.environ["SOURCE_COMMIT"]}',
              f'ref={os.environ["SOURCE_REF"]}',
              'target=x86_64-unknown-linux-musl',
              *images,
              '',
          ]))
          PY
          cd dist
          sha256sum zns-resolver-*-x86_64-linux-musl BUILD-INFO.txt > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zns-resolver-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  guest:
    name: Build SEV-SNP guest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zns-resolver-linux-amd64
          path: binaries
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.guest
          platforms: linux/amd64
          target: guest
          build-contexts: resolvers=binaries
          outputs: type=local,dest=zns-resolver-guest
          provenance: false
          cache-from: type=gha,scope=stagex-guest-amd64
          cache-to: type=gha,scope=stagex-guest-amd64,mode=max
      - run: tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - zns-resolver-guest | gzip -n > zns-resolver-guest-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: zns-resolver-guest-amd64
          path: zns-resolver-guest-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [build, guest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zns-resolver-*
          path: dist
          merge-multiple: true
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum zns-resolver-guest-x86_64.tar.gz >> SHA256SUMS
          release_args=()
          version_without_metadata="${RELEASE_TAG%%+*}"
          if [[ "$version_without_metadata" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag --generate-notes \
            --title "zns-resolver $RELEASE_TAG" \
            "${release_args[@]}" \
            zns-resolver-mainnet-x86_64-linux-musl \
            zns-resolver-testnet-x86_64-linux-musl \
            zns-resolver-guest-x86_64.tar.gz \
            SHA256SUMS BUILD-INFO.txt
