[package]
name = "zcashname-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Rust client for the Zcash Name Service resolver"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcashme/zns-resolver"
keywords = ["zcash", "zns", "name-service"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
