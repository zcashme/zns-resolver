[package]
name = "zcashname-sdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Rust SDK for the Zcash Name System resolver and mint request memos"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcashme/zns-resolver"
keywords = ["zcash", "zns", "name-service"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
