[package]
name = "zns-resolver"
description = "ZcashName (ZNS) resolver: a seer-sync consumer that verifies ZNS bindings and maintains a name → UA index."
version = "0.0.1"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zechariah/zns"
homepage = "https://zns.xyz"
readme = "README.md"
categories = ["cryptography::cryptocurrencies", "database"]
keywords = ["zcash", "zns", "name-service", "resolver"]
publish = false

[dependencies]
# The reusable sync library — stock, commitment-checked, ZNS-blind. We use it
# as a toolkit (block stream, action parsing), not via its `run`/`Account`
# engine: the resolver drives its own scan loop (see `observe`) so the relaxed
# decrypt lives entirely in `zns-verify`, never in seer-sync.
seer-sync = { path = "../seer-sync" }

# ZNS kernel: `verify` (binding check) + `decrypt` (relaxed Orchard trial
# decrypt that surfaces Name Notes the standard ZIP-212 check would discard).
zns-verify = { path = "../zns-verify", features = ["decrypt"] }

# Orchard (for the Note type + the `zns_commitment_keys` accessor used in
# binding verification). ZNS fork that exposes the `unsafe-zns` feature —
# "unsafe" here means protocol-unsafe (it exposes note-commitment internals
# like `g_d`/`pk_d` that stock orchard deliberately hides), not memory-unsafe;
# this crate stays `#![forbid(unsafe_code)]`.
orchard = { path = "../zns-orchard", default-features = false, features = ["unsafe-zns"] }

# librustzcash bits we touch directly (from crates.io)
zcash_protocol = { version = "0.9", default-features = false, features = ["std"] }
zcash_keys = { version = "0.14", default-features = false, features = ["orchard"] }
# Full-transaction parsing for memo recovery (the memo lives in the full
# ciphertext that compact blocks truncate).
zcash_primitives = { version = "0.28", default-features = false }
futures = "0.3"

# Crypto bits
pasta_curves = "0.5"
group = "0.13"

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }

# JSON-RPC API — matches the live ZNS indexer + zcashname-sdk contract so this
# resolver is a drop-in for the resolution methods.
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tooling
anyhow = "1"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[patch.crates-io]
orchard = { path = "../zns-orchard" }

[[bin]]
name = "zns-resolve"
path = "src/bin/zns-resolve.rs"
