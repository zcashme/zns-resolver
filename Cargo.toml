[package]
name = "zns-resolver"
description = "ZNS resolver: verifies name bindings and maintains a name → UA index."
version = "0.0.3"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcashme/zns-resolver"
homepage = "https://www.zcashnames.com/docs"
categories = ["cryptography::cryptocurrencies", "database"]
keywords = ["zcash", "zns", "name-service", "resolver"]
publish = false

[features]
default = ["mainnet"]
# Build against Zcash mainnet (default).
mainnet = []
# Build against Zcash testnet instead of mainnet. A build-time choice so the
# active network is part of the binary's measurement, not runtime-switchable.
#
# To select testnet: cargo build --no-default-features --features testnet
testnet = []

[dependencies]
seer-sync = { version = "0.8", default-features = false }
zns-verify = "0.3.0"
zcash_address = "0.14"
orchard = { version = "0.16", default-features = false, features = ["std"] }
zcash_protocol = { version = "0.11", default-features = false, features = ["std"] }
zcash_primitives = { version = "0.31", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = true }

[dev-dependencies]
serde_json = "1"
