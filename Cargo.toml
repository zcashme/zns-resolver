# ZNS resolver binary (`sync`, `orchard`, `registry`, `jsonrpc`). Watches the registry inbox on Zcash,
# verifies Orchard note bindings, indexes name→UA, serves JSON-RPC.
# Deps: seer-sync (chain I/O + ZNS decryption), zns-verify (crypto + memos; kernel only,
# its optional decrypt feature is unused here), orchard via patched fork.
# zns-verify pinned via git tag (v0.1.0 = kernel API #9 + expires_at), like orchard.
[package]
name = "zns-resolver"
description = "ZNS resolver: verifies name bindings and maintains a name → UA index."
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zechariah/zns"
homepage = "https://zns.xyz"
categories = ["cryptography::cryptocurrencies", "database"]
keywords = ["zcash", "zns", "name-service", "resolver"]
publish = false

[features]
default = ["mainnet"]
# Build against Zcash mainnet (default).
mainnet = []
# Build against Zcash testnet instead of mainnet. A build-time choice so the
# active network is part of the binary's measurement, not runtime-switchable.
#
# To select testnet: cargo build --no-default-features --features testnet
testnet = []

[dependencies]
seer-sync = "0.3.1"
zns-verify = { git = "https://github.com/zcashme/zns-verify.git", tag = "v0.1.0" }
orchard = { version = "0.15.5", default-features = false, features = ["std"] }
zcash_protocol = { version = "0.10", default-features = false, features = ["std"] }
zcash_primitives = { version = "0.29", default-features = false }
zcash_note_encryption = "0.4"
pasta_curves = "0.5"
group = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = true }

[patch.crates-io]
# Git tag of the last commit whose package name is `orchard` (pre-rename).
# Keeps zcash_keys' transitive orchard unified with the ZNS fork — no sibling checkout needed.
orchard = { git = "https://github.com/zcashme/orchard.git", tag = "zns-orchard-v0.15.5" }