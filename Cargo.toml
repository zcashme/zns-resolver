[package]
name = "zns-resolver"
description = "ZcashName (ZNS) resolver: a seer-sync consumer that verifies ZNS bindings and maintains a name → UA index."
version = "0.0.1"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zechariah/zns"
homepage = "https://zns.xyz"
readme = "README.md"
categories = ["cryptography::cryptocurrencies", "database"]
keywords = ["zcash", "zns", "name-service", "resolver"]
publish = false

[dependencies]
# The reusable sync library — pinned to the zns-observe worktree, which carries
# the relaxed orchard decrypt (skips the ZIP-212 cmx check) that Name Notes need.
# master seer-sync stays a clean, commitment-checked general lib.
seer-sync = { path = "../seer-sync-zns-observe", features = ["commitment-tree"] }

# ZNS verifier kernel
zns-verify = { path = "../zns-verify" }

# Orchard (for the Note type + the `zns_commitment_keys` accessor used in
# binding verification). ZNS fork that exposes the `unsafe-zns` feature.
orchard = { path = "../zns-orchard", default-features = false, features = ["unsafe-zns"] }

# librustzcash bits we touch directly (from crates.io)
zcash_protocol = { version = "0.9", default-features = false, features = ["std"] }
zcash_keys = { version = "0.14", default-features = false, features = ["orchard"] }

# Crypto bits
pasta_curves = "0.5"
group = "0.13"

shardtree = "0.6"
incrementalmerkletree = "0.8"

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }

# JSON-RPC API — matches the live ZNS indexer + zcashname-sdk contract so this
# resolver is a drop-in for the resolution methods.
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tooling
anyhow = "1"
thiserror = "1"
hex = "0.4"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
orchard = { path = "../zns-orchard" }

[[bin]]
name = "zns-resolve"
path = "src/bin/zns-resolve.rs"
