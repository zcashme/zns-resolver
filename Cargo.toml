# ZNS resolver binary (`sync`, `orchard`, `registry`, `jsonrpc`). Watches the registry inbox on Zcash,
# verifies Orchard note bindings, indexes name→UA, serves JSON-RPC.
# Local path deps: seer-sync (chain I/O), zns-verify (crypto + memos), zns-orchard.
[package]
name = "zns-resolver"
description = "ZNS resolver: verifies name bindings and maintains a name → UA index."
version = "0.0.1"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zechariah/zns"
homepage = "https://zns.xyz"
categories = ["cryptography::cryptocurrencies", "database"]
keywords = ["zcash", "zns", "name-service", "resolver"]
publish = false

[features]
default = ["mainnet"]
# Build against Zcash mainnet (default).
mainnet = []
# Build against Zcash testnet instead of mainnet. A build-time choice so the
# active network is part of the binary's measurement, not runtime-switchable.
#
# To select testnet: cargo build --no-default-features --features testnet
testnet = []

[dependencies]
seer-sync = { path = "../seer-sync", features = ["zns-decrypt"] }
zns-verify = { path = "../zns-verify", features = ["decrypt"] }
orchard = { path = "../zns-orchard", default-features = false, features = ["unsafe-zns"] }
zcash_protocol = { version = "0.9", default-features = false, features = ["std"] }
zcash_keys = { version = "0.14", default-features = false, features = ["orchard"] }
zcash_primitives = { version = "0.28", default-features = false }
futures = "0.3"
pasta_curves = "0.5"
group = "0.13"
tokio-rusqlite = "0.7"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"] }

[patch.crates-io]
orchard = { path = "../zns-orchard" }